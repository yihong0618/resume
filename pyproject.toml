[project]
name = "resume"
version = "0.1.0"
description = "Resume of Frost Ming"
authors = [
    {name = "Frost Ming", email = "me@frostming.com"},
]
dependencies = [
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "marko>=2.2.5",
    "requests>=2.34.2",
]
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pdm.scripts]
build = {call = "renderer:build(True)"}
dev = {call = "renderer:livereload"}
pdf = {call = "renderer.typst_generator:generate_pdf"}

[dependency-groups]
dev = [
    "pytailwindcss>=0.4.2",
    "livereload>=2.7.1",
]

[build-system]
requires = ["pdm-backend>=2.5.0"]
build-backend = "pdm.backend"
